<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clientes 👥</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ag-grid-community@32.2.0/styles/ag-grid.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ag-grid-community@32.2.0/styles/ag-theme-alpine.css">
<script src="https://cdn.jsdelivr.net/npm/ag-grid-community@32.2.0/dist/ag-grid-community.min.js"></script>
<link rel="stylesheet" href="invitaatuscompas-styles.css">
</head>
<body>
<div class="loading-overlay show" id="loadingOverlay">
<div class="loading-content">
<div class="spinner"></div>
<div style="font-size:14px;color:#5f6368;">Cargando clientes</div>
</div>
</div>
<div class="header">
<div class="logo">
<input type="text" class="document-title" value="Clientes 👥" readonly>
</div>
<div class="header-actions">
<button class="btn btn-azul" onclick="actualizarTodo()">Actualizar &#x1F504;</button>
</div>
</div>
<div class="toolbar">
<input type="text" class="search-input" id="searchInput" placeholder="Buscar por nombre..." oninput="aplicarFiltros()">
<span class="toolbar-label">&#x1F50D;</span>
<span class="rows-counter" id="rowsCounter">0 clientes</span>
</div>
<div class="container">
<div class="stats-bar">
<div class="stat"><span>Total clientes:</span><span class="stat-value" id="totalStat">0</span></div>
</div>
<div class="grid-wrapper">
<div id="myGrid" class="ag-theme-alpine"></div>
</div>
</div>
<script src="clientes-script.js"></script>
</body>
</html>
